name: thisjellyfix
options:
  bundleIdPrefix: com.thisjellyfix
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    tvOS: "17.0"
    visionOS: "1.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    PRODUCT_NAME: thisjellyfix
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_TEAM: LSKYSF7629
targets:
  Core-iOS:
    type: framework
    platform: iOS
    sources: [Sources/ThisJellyFixCore]
    settings: { base: { PRODUCT_MODULE_NAME: ThisJellyFixCore, PRODUCT_NAME: ThisJellyFixCore } }
  Networking-iOS:
    type: framework
    platform: iOS
    sources: [Sources/ThisJellyFixNetworking]
    dependencies: [{ target: Core-iOS }]
    settings: { base: { PRODUCT_MODULE_NAME: ThisJellyFixNetworking, PRODUCT_NAME: ThisJellyFixNetworking } }
  Discovery-iOS:
    type: framework
    platform: iOS
    sources: [Sources/ThisJellyFixDiscovery]
    dependencies:
      - target: Core-iOS
      - target: Networking-iOS
    settings: { base: { PRODUCT_MODULE_NAME: ThisJellyFixDiscovery, PRODUCT_NAME: ThisJellyFixDiscovery } }
  Playback-iOS:
    type: framework
    platform: iOS
    sources: [Sources/ThisJellyFixPlayback]
    dependencies:
      - target: Core-iOS
    settings: { base: { PRODUCT_MODULE_NAME: ThisJellyFixPlayback, PRODUCT_NAME: ThisJellyFixPlayback } }
  Feature-iOS:
    type: framework
    platform: iOS
    sources: [Sources/ThisJellyFixFeature]
    resources: [Assets.xcassets]
    dependencies:
      - target: Core-iOS
      - target: Networking-iOS
      - target: Playback-iOS
      - target: Discovery-iOS
    settings: { base: { PRODUCT_MODULE_NAME: ThisJellyFixFeature, PRODUCT_NAME: ThisJellyFixFeature } }
  thisjellyfix-iOS:
    type: application
    platform: iOS
    sources: [Apps/iOS]
    resources: [Assets.xcassets]
    dependencies:
      - target: Core-iOS
        embed: true
      - target: Networking-iOS
        embed: true
      - target: Playback-iOS
        embed: true
      - target: Feature-iOS
        embed: true
      - target: Discovery-iOS
        embed: true
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: com.thisjellyfix.ios, INFOPLIST_FILE: Apps/iOS/Info.plist, CODE_SIGN_ENTITLEMENTS: Apps/iOS/ThisJellyfix.entitlements } }

  Core-macOS:
    type: framework
    platform: macOS
    sources: [Sources/ThisJellyFixCore]
    settings: { base: { PRODUCT_MODULE_NAME: ThisJellyFixCore, PRODUCT_NAME: ThisJellyFixCore } }
