    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: com.thisjellyfix.macos, ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-macOS, GENERATE_INFOPLIST_FILE: NO, INFOPLIST_FILE: Apps/macOS/Info.plist, CODE_SIGN_ENTITLEMENTS: Apps/macOS/ThisJellyfix.entitlements } }

