name: thisjellyfix
options:
  bundleIdPrefix: com.thisjellyfix
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    tvOS: "17.0"
    visionOS: "1.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    PRODUCT_NAME: thisjellyfix
    GENERATE_INFOPLIST_FILE: YES
targets:
  Core-iOS:
    type: framework
    platform: iOS
    sources: [Sources/ThisJellyFixCore]
    settings: { base: { PRODUCT_MODULE_NAME: ThisJellyFixCore, PRODUCT_NAME: ThisJellyFixCore } }
  Networking-iOS:
    type: framework
    platform: iOS
    sources: [Sources/ThisJellyFixNetworking]
    dependencies: [{ target: Core-iOS }]
    settings: { base: { PRODUCT_MODULE_NAME: ThisJellyFixNetworking, PRODUCT_NAME: ThisJellyFixNetworking } }
  Feature-iOS:
    type: framework
    platform: iOS
    sources: [Sources/ThisJellyFixFeature]
    dependencies: [{ target: Core-iOS }, { target: Networking-iOS }]
    settings: { base: { PRODUCT_MODULE_NAME: ThisJellyFixFeature, PRODUCT_NAME: ThisJellyFixFeature } }
  thisjellyfix-iOS:
    type: application
    platform: iOS
    sources: [Apps/iOS]
    dependencies:
      - target: Core-iOS
        embed: true
      - target: Networking-iOS
        embed: true
      - target: Feature-iOS
        embed: true
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: com.thisjellyfix.ios } }

  Core-macOS:
    type: framework
    platform: macOS
    sources: [Sources/ThisJellyFixCore]
    settings: { base: { PRODUCT_MODULE_NAME: ThisJellyFixCore, PRODUCT_NAME: ThisJellyFixCore } }
  Networking-macOS:
    type: framework
    platform: macOS
    sources: [Sources/ThisJellyFixNetworking]
    dependencies: [{ target: Core-macOS }]
    settings: { base: { PRODUCT_MODULE_NAME: ThisJellyFixNetworking, PRODUCT_NAME: ThisJellyFixNetworking } }
  Feature-macOS:
    type: framework
    platform: macOS
    sources: [Sources/ThisJellyFixFeature]
    dependencies: [{ target: Core-macOS }, { target: Networking-macOS }]
    settings: { base: { PRODUCT_MODULE_NAME: ThisJellyFixFeature, PRODUCT_NAME: ThisJellyFixFeature } }
  thisjellyfix-macOS:
    type: application
    platform: macOS
    sources: [Apps/macOS]
    dependencies:
      - target: Core-macOS
        embed: true
      - target: Networking-macOS
        embed: true
      - target: Feature-macOS
        embed: true
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: com.thisjellyfix.macos } }

  Core-tvOS:
    type: framework
    platform: tvOS
    sources: [Sources/ThisJellyFixCore]
    settings: { base: { PRODUCT_MODULE_NAME: ThisJellyFixCore, PRODUCT_NAME: ThisJellyFixCore } }
  Networking-tvOS:
    type: framework
    platform: tvOS
    sources: [Sources/ThisJellyFixNetworking]
    dependencies: [{ target: Core-tvOS }]
    settings: { base: { PRODUCT_MODULE_NAME: ThisJellyFixNetworking, PRODUCT_NAME: ThisJellyFixNetworking } }
  Feature-tvOS:
    type: framework
    platform: tvOS
    sources: [Sources/ThisJellyFixFeature]
    dependencies: [{ target: Core-tvOS }, { target: Networking-tvOS }]
    settings: { base: { PRODUCT_MODULE_NAME: ThisJellyFixFeature, PRODUCT_NAME: ThisJellyFixFeature } }
  thisjellyfix-tvOS:
    type: application
    platform: tvOS
    sources: [Apps/tvOS]
    dependencies:
      - target: Core-tvOS
        embed: true
      - target: Networking-tvOS
        embed: true
      - target: Feature-tvOS
        embed: true
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: com.thisjellyfix.tvos } }

  Core-visionOS:
    type: framework
    platform: visionOS
    sources: [Sources/ThisJellyFixCore]
    settings: { base: { PRODUCT_MODULE_NAME: ThisJellyFixCore, PRODUCT_NAME: ThisJellyFixCore } }
  Networking-visionOS:
    type: framework
    platform: visionOS
    sources: [Sources/ThisJellyFixNetworking]
    dependencies: [{ target: Core-visionOS }]
    settings: { base: { PRODUCT_MODULE_NAME: ThisJellyFixNetworking, PRODUCT_NAME: ThisJellyFixNetworking } }
  Feature-visionOS:
    type: framework
    platform: visionOS
    sources: [Sources/ThisJellyFixFeature]
    dependencies: [{ target: Core-visionOS }, { target: Networking-visionOS }]
    settings: { base: { PRODUCT_MODULE_NAME: ThisJellyFixFeature, PRODUCT_NAME: ThisJellyFixFeature } }
  thisjellyfix-visionOS:
    type: application
    platform: visionOS
    sources: [Apps/visionOS]
    dependencies:
      - target: Core-visionOS
        embed: true
      - target: Networking-visionOS
        embed: true
      - target: Feature-visionOS
        embed: true
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: com.thisjellyfix.visionos } }
